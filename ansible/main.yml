- name: Set up PXE Server
  hosts: pxeserver
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Create and mount disk
      ansible.builtin.script: files/script.sh
    - name: Set up repo
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'mirrorlist'
        replace: '#mirrorlist'
      loop:
        - /etc/yum.repos.d/CentOS-Linux-AppStream.repo
        - /etc/yum.repos.d/CentOS-Linux-BaseOS.repo
    - name: Set up repo
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '#baseurl=http://mirror.centos.org'
        replace: 'baseurl=http://vault.centos.org'
      loop:
        - /etc/yum.repos.d/CentOS-Linux-AppStream.repo
        - /etc/yum.repos.d/CentOS-Linux-BaseOS.repo
    - name: Install softs on CentOS
      ansible.builtin.yum:
        name:
          - wget
          - epel-release
          - httpd
          - tftp-server
          - dhcp-server
        state: present
        update_cache: true
    - name: Download ISO image CentOS 8.4.2105
      ansible.builtin.shell:
        cmd: cd /mnt/disk && wget https://vault.centos.org/8.4.2105/isos/x86_64/CentOS-8.4.2105-x86_64-dvd1.iso
        executable: /bin/bash
      register: download # <- Registers the command output.
      changed_when: download.rc != 0
    - name: Create ISO directory
      ansible.builtin.file:
        path: /iso
        state: directory
        mode: '0755'
    - name: Mount ISO image
      ansible.posix.mount:
        path: /iso
        src: /mnt/disk/CentOS-8.4.2105-x86_64-dvd1.iso
        fstype: iso9660
        opts: ro,loop
        state: mounted
    - name: Set up httpd config
      ansible.builtin.copy:
        src: pxeboot.conf
        dest: /etc/httpd/conf.d/pxeboot.conf
        owner: root
        group: root
        mode: '0640'
    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
        enabled: true
    - name: Create TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/pxelinux.cfg
        state: directory
        mode: '0755'
    - name: Set up pxelinux
      ansible.builtin.copy:
        src: default
        dest: /var/lib/tftpboot/pxelinux.cfg/default
        owner: root
        group: root
        mode: '0644'
    - name: Extract packages syslinux
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rpm2cpio /iso/BaseOS/Packages/syslinux-tftpboot-6.04-5.el8.noarch.rpm | cpio -dimv
      register: syslinux # <- Registers the command output.
      changed_when: syslinux.rc != 0
    - name: Copy files to TFTP share
      ansible.builtin.copy:
        src: /home/vagrant/tftpboot/{{ item }}
        dest: /var/lib/tftpboot/{{ item }}
        mode: '0644'
        remote_src: true
      loop:
        - pxelinux.0
        - ldlinux.c32
        - libmenu.c32
        - libutil.c32
        - menu.c32
        - vesamenu.c32
    - name: Copy initrd and vmlinuz files to TFTP share
      ansible.builtin.copy:
        src: /iso/images/pxeboot/{{ item }}
        dest: /var/lib/tftpboot/{{ item }}
        mode: '0755'
        remote_src: true
      loop:
        - initrd.img
        - vmlinuz
    - name: Restart tftp-server
      ansible.builtin.service:
        name: tftp.service
        state: restarted
        enabled: true
    - name: Set up dhcp-server
      ansible.builtin.template:
        src: dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
        mode: '0644'
        force: true
    - name: Restart dhcp-server
      ansible.builtin.service:
        name: dhcpd
        state: restarted
        enabled: true
