- name: Настройка сети
  hosts: all
  tasks:
    - name: Обновление репозиториев
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
      tags:
        - apt update
      vars:
        packages:
          - iptables
          - traceroute
    - name: Включить пропуск транзитных пакетов
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.forwarding
        value: '1'
        state: present
      when: ('routers' in group_names)
      tags:
        - ipv4 forwarding enable
    - name: Настраиваем маршруты ...
      ansible.builtin.template:
        src: "{{ ansible_hostname }}-route"
        dest: "/etc/network/if-up.d/route"
        owner: root
        group: root
        mode: "0755"
      tags:
        - set routes
    - name: Настройка NAT для сети
      ansible.builtin.iptables:
        action: "append"
        table: "nat"
        chain: "POSTROUTING"
        jump: "MASQUERADE"
        destination: "!192.168.0.0/16"
        out_interface: "eth0"
      tags:
        - set NAT on internal network
      when: (ansible_hostname == "inetRouter")
    - name: Сохраняем настройки iptables в файл...
      community.general.iptables_state:
        state: saved
        path: /etc/iptables_rules.ipv4
      tags:
        - iptables-save
      when: (ansible_hostname == "inetRouter")
    - name: Копируем скрипт для восстановления правила на постоянку...
      ansible.builtin.template:
        src: "inet_ipv4_restore.sh"
        dest: "/etc/network/if-pre-up.d/iptables"
        owner: root
        group: root
        mode: "0755"
      tags:
        - set iptables-restore
      when: (ansible_hostname == "inetRouter")
    - name: Перезапуск машин
      ansible.builtin.reboot:
        reboot_timeout: 600
