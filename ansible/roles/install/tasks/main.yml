- name: Install dependencies and requirements
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - postgresql-common
      - python3-pexpect
      - acl
    state: present
    update_cache: true
  tags:
    apt
- name: Install PostgreSQL repository
  ansible.builtin.shell:
    cmd: "yes '' | /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh"
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/pgdg.sources
  tags:
    - apt
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - barman-cli
      - barman
    state: present
    update_cache: true
  tags:
    - apt
