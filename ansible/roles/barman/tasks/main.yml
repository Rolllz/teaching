- name: Install barman and postgresql packages on barman
  ansible.builtin.apt:
    name:
      - barman
      - barman-cli
      - postgresql
      - acl
    state: present
    update_cache: true
  when: (ansible_hostname == "barman")

- name: Generate SSH key for postgres
  ansible.builtin.user:
    name: postgres
    generate_ssh_key: true
    ssh_key_type: rsa
    ssh_key_bits: 4096
    force: false
  when: (ansible_hostname == "node1")

- name: Generate SSH key for barman
  ansible.builtin.user:
    name: barman
#    uid: 994
    shell: /bin/bash
    generate_ssh_key: true
    ssh_key_type: rsa
    ssh_key_bits: 4096
    force: false
  when: (ansible_hostname == "barman")

- name: Fetch all public ssh keys node1
  ansible.builtin.shell:
    cmd: cat /var/lib/postgresql/.ssh/id_rsa.pub
    executable: /bin/bash
  register: ssh_keys
  changed_when: ssh_keys.rc != 0
  when: (ansible_hostname == "node1")

#  Копируем ключ с barman на node1
- name: Transfer public key to barman
  delegate_to: barman
  ansible.posix.authorized_key:
    key: "{{ ssh_keys.stdout }}"
    comment: "{{ ansible_hostname }}"
    user: barman
  when: (ansible_hostname == "node1")

- name: Fetch all public ssh keys barman
  ansible.builtin.shell:
    cmd: cat /var/lib/barman/.ssh/id_rsa.pub
    executable: /bin/bash
  register: ssh_keys
  changed_when: ssh_keys.rc != 0
  when: (ansible_hostname == "barman")

#  Копируем ключ с node1 на barman
- name: Transfer public key to barman
  delegate_to: node1
  ansible.posix.authorized_key:
    key: "{{ ssh_keys.stdout }}"
    comment: "{{ ansible_hostname }}"
    user: postgres
  when: (ansible_hostname == "barman")

- name: Create barman user
  community.postgresql.postgresql_user:
    name: barman
    password: '{{ barman_user_password }}'
    role_attr_flags: SUPERUSER
  ignore_errors: true
  register: ignore_errors_register
  when: (ansible_hostname == "node1")

- name: Restart postgresql-server on node1
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted
  when: (ansible_hostname == "node1")

- name: Create DB for backup
  community.postgresql.postgresql_db:
    name: otus
    encoding: UTF-8
    template: template0
    state: present
  when: (ansible_hostname == "node1")

- name: Add tables to otus_backup
  become_user: postgres
  community.postgresql.postgresql_table:
    db: otus
    name: test1
    state: present
  when: (ansible_hostname == "node1")

- name: Copy .pgpass
  ansible.builtin.template:
    src: .pgpass.j2
    dest: /var/lib/barman/.pgpass
    owner: barman
    group: barman
    mode: '0600'
  when: (ansible_hostname == "barman")

- name: Copy barman.conf
  ansible.builtin.template:
    src: barman.conf.j2
    dest: /etc/barman.conf
    owner: barman
    group: barman
    mode: '0755'
  when: (ansible_hostname == "barman")

- name: Copy node1.conf
  ansible.builtin.template:
    src: node1.conf.j2
    dest: /etc/barman.d/node1.conf
    owner: barman
    group: barman
    mode: '0755'
  when: (ansible_hostname == "barman")

- name: Barman switch-wal node1
  become_user: barman
  ansible.builtin.shell:
    cmd: barman switch-wal node1
    executable: /bin/bash
  register: ssh_keys
  changed_when: ssh_keys.rc != 0
  when: (ansible_hostname == "barman")

- name: Barman switch-xlog node1
  become_user: barman
  ansible.builtin.shell:
    cmd: barman switch-xlog --force --archive node1
    executable: /bin/bash
  register: ssh_keys
  changed_when: ssh_keys.rc != 0
  when: (ansible_hostname == "barman")

- name: Barman cron
  become_user: barman
  ansible.builtin.shell:
    cmd: barman cron
    executable: /bin/bash
  register: ssh_keys
  changed_when: ssh_keys.rc != 0
  when: (ansible_hostname == "barman")
